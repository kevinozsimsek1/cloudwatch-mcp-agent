[project]
name = "cloudwatch-agent"
version = "0.1.0"
description = "CloudWatch observability agent powered by gpt-oss-20b"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.38.0",
    "botocore>=1.38.0",
    "fastapi[standard]>=0.115.0",
    "mcp[cli]>=1.2.0",
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
cloudwatch-agent = "app.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
